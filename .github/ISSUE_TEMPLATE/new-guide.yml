name: New guide proposal
description: Suggest a focused cheatsheet or methodology that is missing.
title: "[Guide]: "
labels:
  - enhancement
  - documentation
body:
  - type: input
    id: topic
    attributes:
      label: Topic
      placeholder: AD CS assessment with Certipy
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Practical use case
      description: Explain who needs this guide and where it fits in an authorized assessment.
    validations:
      required: true
  - type: textarea
    id: outline
    attributes:
      label: Suggested outline and official sources
      description: Include maintained upstream documentation where possible.
    validations:
      required: true
