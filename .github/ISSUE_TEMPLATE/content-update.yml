name: Content update
description: Report an outdated command, tool, link, or workflow.
title: "[Update]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: Thanks for helping keep the field guide accurate.
  - type: input
    id: document
    attributes:
      label: Document
      description: Repository path or URL of the affected cheatsheet.
      placeholder: Cloud-Security/Azure-Pentesting.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is outdated or incorrect?
      description: Include the exact section or command and the observed behavior.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Verification source
      description: Prefer official documentation, release notes, or the maintained upstream repository.
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: Safety confirmation
      options:
        - label: Any testing described here was performed in an authorized environment.
          required: true
