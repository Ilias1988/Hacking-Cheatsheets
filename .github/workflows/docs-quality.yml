name: Documentation quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository structure and internal links
        run: python scripts/validate_docs.py .

      - name: Test documentation validator
        run: python -m unittest discover -s tests -v

      - name: Report content verification coverage
        run: python scripts/content_health.py . --require-status

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml "./**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
